[workspace]
members = ["crates/core", "crates/wasm", "crates/wasm-workbook", "crates/mcp", "crates/workbook", "xtask", "examples/workbook-budget"]
resolver = "2"

[workspace.package]
version = "7.0.2"
edition = "2021"
license = "MIT"
authors = ["truecalc"]
repository = "https://github.com/truecalc/core"

[profile.release]
lto = true
opt-level = 's'
codegen-units = 1
strip = true
panic = 'abort'
