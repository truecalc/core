[workspace]
members = ["crates/core", "crates/wasm", "crates/wasm-workbook", "crates/python", "crates/workbook", "xtask", "examples/workbook-budget"]
resolver = "2"

[workspace.package]
version = "9.0.0"
edition = "2021"
license = "MIT"
authors = ["truecalc"]
repository = "https://github.com/truecalc/core"

[profile.release]
lto = true
opt-level = 's'
codegen-units = 1
strip = true
panic = 'abort'

# Wheel builds only (crates/python). Identical to `release` except that panics
# unwind: PyO3 turns a Rust panic into a Python exception, and doing so requires
# unwinding. Built under `panic = "abort"` an engine panic would abort the host
# interpreter — killing the caller's process instead of raising. `panic` cannot
# be set per package, so the Python wheel gets its own profile; see
# crates/python/pyproject.toml.
[profile.release-python]
inherits = "release"
panic = "unwind"
