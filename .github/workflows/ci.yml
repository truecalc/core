name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check fixture / code separation
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/${BASE_REF}"...HEAD)

          gs_changes=$(echo "$changed" \
            | grep -c "^crates/core/tests/fixtures/google_sheets/.*\.tsv$" || true)
          other_changes=$(echo "$changed" \
            | grep -vc "^crates/core/tests/fixtures/google_sheets/.*\.tsv$" || true)

          if [ "$gs_changes" -gt 0 ] && [ "$other_changes" -gt 0 ]; then
            echo "::error::This PR mixes canonical fixture changes with code changes."
            echo "::error::google_sheets/*.tsv updates and code changes must be separate PRs."
            echo ""
            echo "Canonical fixture files changed in this PR:"
            echo "$changed" | grep "^crates/core/tests/fixtures/google_sheets/.*\.tsv$"
            exit 1
          fi

          if [ "$gs_changes" -gt 0 ]; then
            count=$(echo "$changed" | grep -c "\.tsv$" || true)
            echo "Fixtures-only PR — ${count} canonical TSV file(s) changed, no code changes."
          else
            echo "Code PR — no canonical fixture files changed."
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Test
        run: |
          # truecalc-python is excluded: with `extension-module` its test binary
          # cannot link libpython, and the crate has no Rust tests — its
          # surface is exercised by the Python suite in the `python` job.
          cargo nextest run --workspace --exclude truecalc-python --profile ci 2>&1 | tee nextest-output.txt
          exit ${PIPESTATUS[0]}

      - name: Write test summary
        if: always()
        run: |
          echo '## Test Results' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat nextest-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: target/nextest/ci/junit.xml
          check_name: truecalc-core tests

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: |
          cargo llvm-cov -p truecalc-core -p truecalc-workbook --lcov --output-path lcov.info
          cargo llvm-cov -p truecalc-core -p truecalc-workbook --html --output-dir target/coverage-html

      - name: Generate conformance report
        run: cargo test -p truecalc-core --test conformance generate_conformance_report -- --nocapture

      - name: Download main-branch conformance baseline
        run: |
          gh run download \
            --repo "$GITHUB_REPOSITORY" \
            --branch main \
            --name conformance-report \
            --dir baseline/ \
            2>/dev/null || echo "No baseline found (first run or main has no artifact)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        continue-on-error: true

      - name: Upload conformance report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: target/conformance-report.json
          retention-days: 30

      - name: Post conformance PR comment
        if: github.event_name == 'pull_request'
        run: |
          bash .github/scripts/post-conformance-comment.sh \
            target/conformance-report.json \
            baseline/conformance-report.json \
            "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Post coverage table as PR comment
        if: github.event_name == 'pull_request'
        run: |
          bash .github/scripts/post-coverage-comment.sh \
            target/nextest/ci/junit.xml \
            target/conformance-report.json \
            "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Generate conformance-summary.json
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: python
        run: |
          import json, re, datetime, subprocess
          with open("target/conformance-report.json") as f:
              report = json.load(f)
          cargo_toml = open("Cargo.toml").read()
          version = re.search(r'^version\s*=\s*"([^"]+)"', cargo_toml, re.MULTILINE).group(1)
          git_sha = subprocess.check_output(["git", "rev-parse", "--short=7", "HEAD"]).decode().strip()
          blocking_categories = {
              "math", "logical", "info", "statistical", "operator", "text",
              "date", "engineering", "lookup", "parser", "database", "array",
              "filter", "web", "financial",
          }
          categories = [
              {"name": name, "passed": stats["passed"], "total": stats["total"],
               "blocking": name in blocking_categories}
              for name, stats in sorted(report.get("by_category", {}).items())
          ]
          summary = {
              "generated": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "version": version,
              "git_sha": git_sha,
              "categories": categories,
              "overall": {"passed": report["passed"], "total": report["total"]},
          }
          # The report-only corpus, published alongside `overall` rather than
          # folded into it: `overall` means "the enforced suite", which is what
          # the badge asserts. Consumers wanting the whole picture add the two.
          # Published so docs and the marketing site read one file instead of
          # hard-coding figures that drift the moment a gap is fixed.
          if report.get("tracked"):
              summary["tracked"] = {
                  "passed": report["tracked"]["passed"],
                  "total": report["tracked"]["total"],
              }
          with open("/tmp/conformance-summary.json", "w") as f:
              json.dump(summary, f, indent=2)
              f.write("\n")
          tracked = summary.get("tracked")
          tracked_note = f", tracked {tracked['passed']}/{tracked['total']}" if tracked else ""
          print(f"conformance-summary.json: {report['passed']}/{report['total']} passed, {len(categories)} categories{tracked_note}")

      - name: Publish conformance report to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          total=$(grep '"total"'  target/conformance-report.json | grep -o '[0-9]*' | head -1)
          passed=$(grep '"passed"' target/conformance-report.json | grep -o '[0-9]*' | head -1)
          pct=$(awk "BEGIN { printf \"%.1f\", ($passed/$total)*100 }")
          if   (( $(echo "$pct >= 99.0" | bc -l) )); then color="brightgreen"; hex="#4c1"
          elif (( $(echo "$pct >= 95.0" | bc -l) )); then color="green";       hex="#3c3"
          elif (( $(echo "$pct >= 90.0" | bc -l) )); then color="yellow";      hex="#db1"
          else color="red"; hex="#e05"
          fi
          badge_json="{\"schemaVersion\":1,\"label\":\"Google Sheets Conformance\",\"message\":\"${passed}/${total} · ${pct}%\",\"color\":\"${color}\"}"
          cov_pct=$(python3 -c "import re; c=open('lcov.info').read(); lh=sum(int(m) for m in re.findall(r'^LH:(\d+)',c,re.M)); lf=sum(int(m) for m in re.findall(r'^LF:(\d+)',c,re.M)); print(f'{lh/lf*100:.1f}' if lf else '0.0')")
          if   (( $(echo "$cov_pct >= 80.0" | bc -l) )); then cov_color="brightgreen"
          elif (( $(echo "$cov_pct >= 60.0" | bc -l) )); then cov_color="green"
          elif (( $(echo "$cov_pct >= 40.0" | bc -l) )); then cov_color="yellow"
          else cov_color="red"
          fi
          cov_badge_json="{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${cov_pct}%\",\"color\":\"${cov_color}\"}"
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cargo build -p truecalc-mcp 2>&1 | tail -1
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"list_functions","arguments":{}}}' \
            | ./target/debug/truecalc-mcp \
            | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); fns=json.loads(d['result']['content'][0]['text'])['functions']; json.dump(sorted(fns,key=lambda f:f['name']),sys.stdout)" \
            > target/functions.json
          fn_count=$(python3 -c "import json; print(len(json.load(open('target/functions.json'))))")
          functions_badge_json="{\"schemaVersion\":1,\"label\":\"functions\",\"message\":\"${fn_count}\",\"color\":\"blue\"}"
          python3 .github/scripts/generate-pages-html.py \
            target/nextest/ci/junit.xml \
            target/conformance-report.json \
            "$run_url" "${hex}" "${passed}" "${total}" "${pct}" "${cov_pct}" \
            target/functions.json \
            > /tmp/conformance.html
          cp -r target/coverage-html/html /tmp/coverage-html
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          echo "$badge_json" > conformance-badge.json
          echo "$cov_badge_json" > coverage-badge.json
          echo "$functions_badge_json" > functions-badge.json
          cp /tmp/conformance.html index.html
          rm -rf coverage && cp -r /tmp/coverage-html coverage
          touch .nojekyll
          cp /tmp/conformance-summary.json conformance-summary.json
          git add conformance-badge.json coverage-badge.json functions-badge.json index.html .nojekyll coverage/ conformance-summary.json
          git diff --cached --quiet || git commit -m "chore: update conformance + coverage report [skip ci]"
          git push --force origin gh-pages
          # Restore working tree so subsequent steps (Clippy, wasm-pack) see source files.
          git checkout "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Deny check
        run: cargo deny check

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build WASM
        run: wasm-pack build crates/wasm --target web

      - name: Build WASM workbook
        run: wasm-pack build crates/wasm-workbook --target web

  bench:
    name: Criterion benchmarks + regression gate
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Self-test the perf regression gate
        run: python3 .github/scripts/test_check_perf_regression.py

      - name: Run benchmarks
        continue-on-error: true
        run: |
          cargo bench -p truecalc-workbook --bench workbook_perf -- --output-format bencher | tee /tmp/bench_output.txt

      - name: Check perf regressions
        run: python3 .github/scripts/check_perf_regression.py < /tmp/bench_output.txt

      - name: Generate perf summary
        run: python3 .github/scripts/gen_perf_summary.py < /tmp/bench_output.txt > /tmp/perf-summary.json

      - name: Upload perf-summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: perf-summary
          path: /tmp/perf-summary.json
          retention-days: 30

  publish-perf:
    name: Publish perf-summary to gh-pages
    needs: bench
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download perf-summary artifact
        uses: actions/download-artifact@v4
        with:
          name: perf-summary
          path: /tmp/perf-summary

      - name: Publish perf-summary.json to gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          cp /tmp/perf-summary/perf-summary.json perf-summary.json
          git add perf-summary.json
          git diff --cached --quiet || git commit -m "chore: update perf-summary.json [skip ci]"
          git push --force origin gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  examples:
    name: npm examples (Node LTS)
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build WASM workbook
        run: wasm-pack build crates/wasm-workbook --target web

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run workbook-node example
        run: WASM_PKG_PATH=./crates/wasm-workbook/pkg/truecalc_wasm_workbook.js node examples/workbook-node/index.mjs

  macos-golden:
    name: macOS golden byte-identity (truecalc-workbook)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Verifies the truecalc-workbook canonical-JSON golden files are
      # byte-identical on macOS (issue #530 P2.3 acceptance: Linux + macOS).
      # The golden byte-identity assertions live in
      # crates/workbook/tests/canonical_json_tests.rs; running the crate's
      # full test set (incl. canonical_json + golden) keeps this minimal yet
      # complete for proving cross-OS byte identity.
      - name: Test truecalc-workbook (golden + canonical JSON)
        run: cargo test -p truecalc-workbook

  fmt:
    name: rustfmt (files changed by this PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Ratchet, not a whole-workspace check: most of this tree predates any
      # formatting gate, so `cargo fmt --all -- --check` would fail on files
      # the PR never touched. The script enforces rustfmt on files the PR adds
      # and on files that were already clean at the merge base, and reports
      # (without failing) files that were dirty before the branch.
      - name: Check formatting of changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/fmt-changed.sh "origin/$BASE_REF"
