name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. truecalc-core-v0.1.1)"
        required: true

permissions:
  contents: write
  id-token: write  # for npm provenance

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the tag being released, not whatever main happens to be.
          # Without this every job races merges landing after dispatch, and
          # JSR versions are immutable — a wrong publish cannot be replaced.
          ref: ${{ github.event.inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build WASM
        run: wasm-pack build crates/wasm --target bundler

      - name: Set npm package name
        run: node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); p.name='@truecalc/core'; p.license='MIT'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n')"
        working-directory: crates/wasm/pkg

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: crates/wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-npm-workbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the tag being released, not whatever main happens to be.
          # Without this every job races merges landing after dispatch, and
          # JSR versions are immutable — a wrong publish cannot be replaced.
          ref: ${{ github.event.inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build WASM workbook
        run: wasm-pack build crates/wasm-workbook --target web

      - name: Set npm package name
        run: node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); p.name='@truecalc/workbook'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n')"
        working-directory: crates/wasm-workbook/pkg

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish @truecalc/workbook to npm
        run: npm publish --provenance --access public
        working-directory: crates/wasm-workbook/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # JSR (Deno). Deliberately part of the release workflow rather than the
  # `on: push: branches: [main]` job JSR's own docs suggest: JSR versions are
  # immutable and duplicates are rejected, so publishing on every merge would
  # turn every non-release push to main red, and any merge that did carry a
  # version bump would publish with no release gate.
  #
  # No secret is needed — the package is linked to this repo on JSR and
  # authenticates over OIDC, which is what `id-token: write` below is for.
  publish-jsr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC — how JSR authenticates this workflow
    strategy:
      # Fail one package without silently skipping the other.
      fail-fast: false
      matrix:
        include:
          - crate: wasm
            package: "@truecalc/core"
            entry: truecalc_wasm.js
          - crate: wasm-workbook
            package: "@truecalc/workbook"
            entry: truecalc_wasm_workbook.js
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the tag being released, not whatever main happens to be.
          # Without this every job races merges landing after dispatch, and
          # JSR versions are immutable — a wrong publish cannot be replaced.
          ref: ${{ github.event.inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # `--target bundler` (not `web`): Deno 2 consumes that output natively via
      # wasm ESM integration, so consumers need no `init()` call and no runtime
      # permissions. A `web` build would fetch the .wasm at load and force
      # `--allow-net` on every caller of a pure-computation library.
      #
      # This is a separate build from the npm one on purpose — it leaves the
      # published npm artifacts byte-for-byte unchanged.
      - name: Build WASM for JSR
        run: wasm-pack build crates/${{ matrix.crate }} --target bundler

      # wasm-pack writes a `.gitignore` containing `*` into pkg/, and JSR honours
      # gitignore when collecting files — without this, publish fails with every
      # module "excluded from publishing".
      - name: Drop wasm-pack's generated .gitignore
        run: rm -f crates/${{ matrix.crate }}/pkg/.gitignore

      # wasm-pack copies the crate README into pkg/, and JSR ships it as the
      # package page. That README documents the *npm* build — which for
      # wasm-workbook is a `--target web` build requiring `await init()`, an API
      # that does not exist here (bundler output has no default export at all).
      # Shipping it would give Deno users instructions that fail on first run.
      - name: Use the Deno-specific README
        run: cp crates/${{ matrix.crate }}/README.jsr.md crates/${{ matrix.crate }}/pkg/README.md

      # The version is DERIVED, never typed in — a hand-edited jsr.json is
      # exactly how registries drift out of lockstep (#797). It is read from the
      # package.json wasm-pack just generated, which is the identical file the
      # npm job publishes from, so npm and JSR agree by construction rather than
      # by both happening to parse Cargo.toml the same way.
      - name: Write jsr.json with the published version
        run: |
          set -euo pipefail
          cd crates/${{ matrix.crate }}/pkg
          VERSION=$(jq -er .version package.json)
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "refusing to publish non-semver version: '$VERSION'"; exit 1 ;;
          esac
          echo "publishing ${{ matrix.package }}@$VERSION"
          # publish.exclude "!*.wasm" is REQUIRED, not defensive: this repo's
          # root .gitignore has `*.wasm`, JSR honours gitignore when collecting
          # files, and the export graph references the .wasm — so without the
          # negative glob the publish fails with `excluded-module`, having
          # otherwise looked completely healthy.
          jq -n \
            --arg name "${{ matrix.package }}" \
            --arg version "$VERSION" \
            --arg entry "./${{ matrix.entry }}" \
            '{name: $name, version: $version, license: "MIT", exports: $entry,
              publish: {exclude: ["!*.wasm"]}}' \
            > jsr.json

      # `deno publish`, not `npx jsr@latest publish`. The npx wrapper ignores
      # PATH and downloads its own Deno at run time, so setup-deno above was
      # dead weight and its version pin never applied — and it put two unpinned
      # executables inside the only job holding an OIDC token for the @truecalc
      # scope. Using Deno directly also restores type checking, which the
      # wrapper silently disables with --no-check.
      - name: Publish to JSR
        run: deno publish --allow-dirty
        working-directory: crates/${{ matrix.crate }}/pkg

  # Artifact naming (truecalc-mcp-{target}{binary-ext}) matches cargo-binstall's
  # own template placeholders on purpose — see the pkg-url in crates/mcp/Cargo.toml.
  # #798 and #799 (uvx/PyPI and npx/npm distribution) wrap these same binaries
  # rather than cross-compiling their own; keep target coverage here in sync
  # with what those wrappers claim to support.
  build-binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # aarch64-unknown-linux-gnu can't link on an x86_64 ubuntu-latest host
          # without a matching cross toolchain; `cross` builds it in the
          # target's own Docker image instead of native cargo.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the tag being released, not whatever main happens to be.
          # Without this every job races merges landing after dispatch, and
          # JSR versions are immutable — a wrong publish cannot be replaced.
          ref: ${{ github.event.inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build -p truecalc-mcp --release --target ${{ matrix.target }}
          else
            cargo build -p truecalc-mcp --release --target ${{ matrix.target }}
          fi

      - name: Rename binary
        shell: bash
        run: mv "target/${{ matrix.target }}/release/truecalc-mcp${{ matrix.ext }}" "truecalc-mcp-${{ matrix.target }}${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: truecalc-mcp-${{ matrix.target }}
          path: truecalc-mcp-${{ matrix.target }}${{ matrix.ext }}

  attach-binaries:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the tag being released, not whatever main happens to be.
          # Without this every job races merges landing after dispatch, and
          # JSR versions are immutable — a wrong publish cannot be replaced.
          ref: ${{ github.event.inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Attach binaries to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: gh release upload "$TAG" artifacts/**/* --clobber

  # Regenerates and pushes Formula/truecalc-mcp.rb to the truecalc/homebrew-mcp tap.
  # Needs attach-binaries (not just build-binaries) so the release assets the
  # formula's URLs point to already exist by the time it's pushed — otherwise
  # `brew install` could 404 in the gap between this job and attach-binaries.
  #
  # HOMEBREW_TAP_TOKEN is a fine-grained PAT scoped to contents:write on
  # truecalc/homebrew-mcp only; the default GITHUB_TOKEN here is scoped to this
  # repo and can't push there. The empty-check below only covers the token
  # never having been configured — an *expired* token still fails this job
  # loudly (git clone fails under set -euo pipefail), which is deliberate: a
  # silent skip on expiry would let the tap drift out of date unnoticed.
  #
  # Windows isn't included: Homebrew doesn't run on Windows.
  publish-homebrew:
    needs: attach-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read   # only ever pushes with the external HOMEBREW_TAP_TOKEN, never GITHUB_TOKEN
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: truecalc-mcp-*
          path: artifacts/
          merge-multiple: true

      - name: Render and push formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          # `secrets` isn't a usable context in `if:` conditions, so the
          # empty-check happens here at runtime instead of at the step level.
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not set; skipping Homebrew formula publish"
            exit 0
          fi

          VERSION="${TAG#truecalc-core-v}"
          # Anchored regex, not a case/glob pattern: glob `*` absorbs arbitrary
          # characters (quotes, semicolons, ...), so a case match here would
          # only bound the shape loosely — and $VERSION gets interpolated
          # straight into a heredoc that becomes a committed Ruby file.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing to publish formula for non-semver tag: '$TAG'"
            exit 1
          fi

          sha() { sha256sum "artifacts/$1" | cut -d' ' -f1; }
          MACOS_ARM64=$(sha truecalc-mcp-aarch64-apple-darwin)
          MACOS_X64=$(sha truecalc-mcp-x86_64-apple-darwin)
          LINUX_ARM64=$(sha truecalc-mcp-aarch64-unknown-linux-gnu)
          LINUX_X64=$(sha truecalc-mcp-x86_64-unknown-linux-gnu)

          git clone "https://x-access-token:${GH_TOKEN}@github.com/truecalc/homebrew-mcp.git" tap

          cat > tap/Formula/truecalc-mcp.rb <<FORMULA
          # frozen_string_literal: true

          class TruecalcMcp < Formula
            desc "MCP server exposing TrueCalc spreadsheet formula evaluation for AI assistants"
            homepage "https://github.com/truecalc/core"
            version "$VERSION"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/truecalc/core/releases/download/$TAG/truecalc-mcp-aarch64-apple-darwin"
                sha256 "$MACOS_ARM64"
              else
                url "https://github.com/truecalc/core/releases/download/$TAG/truecalc-mcp-x86_64-apple-darwin"
                sha256 "$MACOS_X64"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/truecalc/core/releases/download/$TAG/truecalc-mcp-aarch64-unknown-linux-gnu"
                sha256 "$LINUX_ARM64"
              else
                url "https://github.com/truecalc/core/releases/download/$TAG/truecalc-mcp-x86_64-unknown-linux-gnu"
                sha256 "$LINUX_X64"
              end
            end

            def install
              bin.install Dir["truecalc-mcp-*"].first => "truecalc-mcp"
            end

            # truecalc-mcp has no --version/--help flags; it reads JSON-RPC requests from
            # stdin in a loop and only exits when stdin closes. Piping /dev/null confirms
            # the binary starts and exits cleanly on EOF without hanging the test run.
            test do
              system "/bin/sh", "-c", "#{bin}/truecalc-mcp < /dev/null"
            end
          end
          FORMULA

          cd tap
          git config user.name "truecalc-release-bot"
          git config user.email "actions@github.com"

          if git diff --quiet -- Formula/truecalc-mcp.rb; then
            echo "formula unchanged, nothing to push"
            exit 0
          fi

          git add Formula/truecalc-mcp.rb
          git commit -m "truecalc-mcp $VERSION"
          git push origin main

  # Lists/updates truecalc-mcp in the official MCP Registry. Auth is GitHub
  # OIDC (mcp-publisher login github-oidc) — no secret needed: running as a
  # GitHub Action on a repo under the truecalc org is itself what lets this
  # claim the io.github.truecalc namespace, per the registry's publishing
  # docs (github.com/modelcontextprotocol/registry).
  #
  # server.json is rendered here, not hand-maintained, for the same reason
  # jsr.json is above (#797): a hand-edited version is how registries drift
  # out of lockstep. Only cargo is listed as a package today — npm/pypi
  # entries belong here once #799/#798 exist.
  publish-mcp-registry:
    needs: attach-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC — how the MCP Registry authenticates this workflow
    steps:
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Render server.json
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#truecalc-core-v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing to publish registry listing for non-semver tag: '$TAG'"
            exit 1
          fi

          jq -n --arg version "$VERSION" '{
            "$schema": "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json",
            name: "io.github.truecalc/truecalc-mcp",
            description: "MCP server exposing TrueCalc spreadsheet formula evaluation as tools for AI assistants.",
            version: $version,
            repository: { url: "https://github.com/truecalc/core", source: "github", subfolder: "crates/mcp" },
            packages: [
              {
                registryType: "cargo",
                identifier: "truecalc-mcp",
                version: $version,
                transport: { type: "stdio" }
              }
            ]
          }' > server.json

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
