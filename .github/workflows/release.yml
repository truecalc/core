name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. truecalc-core-v0.1.1)"
        required: true

permissions:
  contents: read
  id-token: write  # for npm provenance

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the tag being released, not whatever main happens to be.
          # Without this every job races merges landing after dispatch, and
          # JSR versions are immutable — a wrong publish cannot be replaced.
          ref: ${{ github.event.inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # Two builds on purpose. `bundler` is the primary artifact: it relies on
      # WebAssembly ESM integration, so Deno and Node need no `init()` call and
      # no permissions. Bun does not support that and throws `malloc is not a
      # function` (core#815) — and `bun build --target=bun` does not rescue it,
      # so callers cannot bundle their way out. A `web` build works in Bun, at
      # the cost of an `await init()`, and is exposed only to Bun via the
      # conditional export written below.
      - name: Build WASM (bundler — Node, Deno, bundlers)
        run: wasm-pack build crates/wasm --target bundler

      # Only the JS glue is copied, not the wasm: both targets emit a
      # byte-identical truecalc_wasm_bg.wasm, and the web glue locates it with
      # `new URL('truecalc_wasm_bg.wasm', import.meta.url)` — so at the package
      # root it resolves to the one already there. Shipping a second copy would
      # add 2 MB and roughly double the tarball for every Node and Deno user.
      # The hash check makes that assumption fail loudly if it ever stops
      # holding, rather than silently serving Bun a mismatched module.
      - name: Build WASM (web — Bun only)
        run: |
          set -euo pipefail
          wasm-pack build crates/wasm --target web --out-dir pkg-bun
          a=$(sha256sum crates/wasm/pkg/truecalc_wasm_bg.wasm | cut -d" " -f1)
          b=$(sha256sum crates/wasm/pkg-bun/truecalc_wasm_bg.wasm | cut -d" " -f1)
          if [ "$a" != "$b" ]; then
            echo "bundler and web targets emitted different wasm ($a vs $b);"
            echo "the Bun glue can no longer share the root wasm — ship it separately"
            exit 1
          fi
          cp crates/wasm/pkg-bun/truecalc_wasm.js   crates/wasm/pkg/truecalc_wasm_bun.js
          cp crates/wasm/pkg-bun/truecalc_wasm.d.ts crates/wasm/pkg/truecalc_wasm_bun.d.ts

      - name: Set npm package name and exports
        run: node scripts/npm-package-json.mjs crates/wasm/pkg

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: crates/wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-npm-workbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the tag being released, not whatever main happens to be.
          # Without this every job races merges landing after dispatch, and
          # JSR versions are immutable — a wrong publish cannot be replaced.
          ref: ${{ github.event.inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build WASM workbook
        run: wasm-pack build crates/wasm-workbook --target web

      # wasm-pack derives `license` from Cargo.toml (Elastic-2.0) and copies the
      # crate's LICENSE into pkg/; npm packs a LICENSE file regardless of `files`.
      # NOTICE is neither copied nor packed by default, and it has to ship: the
      # wasm artifact statically links MIT `truecalc-core`, and MIT requires its
      # copyright and permission notice to travel with the code. The license
      # assertion below is a guard, not decoration — a silent revert to the
      # workspace MIT default would publish ELv2 code under MIT.
      - name: Set npm package name and ship the license notices
        run: |
          set -euo pipefail
          cp ../NOTICE NOTICE
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json'));
            p.name = '@truecalc/workbook';
            if (p.license !== 'Elastic-2.0') {
              console.error('expected license Elastic-2.0, got ' + p.license);
              process.exit(1);
            }
            if (!Array.isArray(p.files)) {
              console.error('package.json has no \`files\` array — refusing to publish blind');
              process.exit(1);
            }
            for (const f of ['LICENSE', 'NOTICE']) if (!p.files.includes(f)) p.files.push(f);
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
        working-directory: crates/wasm-workbook/pkg

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish @truecalc/workbook to npm
        run: npm publish --provenance --access public
        working-directory: crates/wasm-workbook/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # JSR (Deno). Deliberately part of the release workflow rather than the
  # `on: push: branches: [main]` job JSR's own docs suggest: JSR versions are
  # immutable and duplicates are rejected, so publishing on every merge would
  # turn every non-release push to main red, and any merge that did carry a
  # version bump would publish with no release gate.
  #
  # No secret is needed — the package is linked to this repo on JSR and
  # authenticates over OIDC, which is what `id-token: write` below is for.
  publish-jsr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC — how JSR authenticates this workflow
    strategy:
      # Fail one package without silently skipping the other.
      fail-fast: false
      matrix:
        include:
          - crate: wasm
            package: "@truecalc/core"
            entry: truecalc_wasm.js
            # @truecalc/core compiles only truecalc-core, which stays MIT.
            license: MIT
          - crate: wasm-workbook
            package: "@truecalc/workbook"
            entry: truecalc_wasm_workbook.js
            # @truecalc/workbook compiles truecalc-workbook, which is ELv2. This
            # must track crates/wasm-workbook/Cargo.toml — a hardcoded "MIT" here
            # would publish ELv2 code to JSR under MIT.
            license: Elastic-2.0
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the tag being released, not whatever main happens to be.
          # Without this every job races merges landing after dispatch, and
          # JSR versions are immutable — a wrong publish cannot be replaced.
          ref: ${{ github.event.inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # `--target bundler` (not `web`): Deno 2 consumes that output natively via
      # wasm ESM integration, so consumers need no `init()` call and no runtime
      # permissions. A `web` build would fetch the .wasm at load and force
      # `--allow-net` on every caller of a pure-computation library.
      #
      # This is a separate build from the npm one on purpose — it leaves the
      # published npm artifacts byte-for-byte unchanged.
      - name: Build WASM for JSR
        run: wasm-pack build crates/${{ matrix.crate }} --target bundler

      # wasm-pack writes a `.gitignore` containing `*` into pkg/, and JSR honours
      # gitignore when collecting files — without this, publish fails with every
      # module "excluded from publishing".
      - name: Drop wasm-pack's generated .gitignore
        run: rm -f crates/${{ matrix.crate }}/pkg/.gitignore

      # wasm-pack copies the crate README into pkg/, and JSR ships it as the
      # package page. That README documents the *npm* build — which for
      # wasm-workbook is a `--target web` build requiring `await init()`, an API
      # that does not exist here (bundler output has no default export at all).
      # Shipping it would give Deno users instructions that fail on first run.
      - name: Use the Deno-specific README
        run: cp crates/${{ matrix.crate }}/README.jsr.md crates/${{ matrix.crate }}/pkg/README.md

      # Only wasm-workbook has one: its artifact links MIT truecalc-core, and MIT
      # requires the notice to travel with the code. wasm-pack already copied the
      # crate LICENSE into pkg/.
      - name: Ship the third-party notice, if the crate has one
        run: |
          set -euo pipefail
          if [ -f crates/${{ matrix.crate }}/NOTICE ]; then
            cp crates/${{ matrix.crate }}/NOTICE crates/${{ matrix.crate }}/pkg/NOTICE
          fi

      # The version is DERIVED, never typed in — a hand-edited jsr.json is
      # exactly how registries drift out of lockstep (#797). It is read from the
      # package.json wasm-pack just generated, which is the identical file the
      # npm job publishes from, so npm and JSR agree by construction rather than
      # by both happening to parse Cargo.toml the same way.
      - name: Write jsr.json with the published version
        run: |
          set -euo pipefail
          cd crates/${{ matrix.crate }}/pkg
          VERSION=$(jq -er .version package.json)
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "refusing to publish non-semver version: '$VERSION'"; exit 1 ;;
          esac
          echo "publishing ${{ matrix.package }}@$VERSION"
          # publish.exclude "!*.wasm" is REQUIRED, not defensive: this repo's
          # root .gitignore has `*.wasm`, JSR honours gitignore when collecting
          # files, and the export graph references the .wasm — so without the
          # negative glob the publish fails with `excluded-module`, having
          # otherwise looked completely healthy.
          jq -n \
            --arg name "${{ matrix.package }}" \
            --arg version "$VERSION" \
            --arg entry "./${{ matrix.entry }}" \
            --arg license "${{ matrix.license }}" \
            '{name: $name, version: $version, license: $license, exports: $entry,
              publish: {exclude: ["!*.wasm"]}}' \
            > jsr.json

      # `deno publish`, not `npx jsr@latest publish`. The npx wrapper ignores
      # PATH and downloads its own Deno at run time, so setup-deno above was
      # dead weight and its version pin never applied — and it put two unpinned
      # executables inside the only job holding an OIDC token for the @truecalc
      # scope. Using Deno directly also restores type checking, which the
      # wrapper silently disables with --no-check.
      - name: Publish to JSR
        run: deno publish --allow-dirty
        working-directory: crates/${{ matrix.crate }}/pkg
