name: Bug report
description: A formula produces the wrong result, an unexpected error, or otherwise doesn't match Google Sheets.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: formula
    attributes:
      label: Formula
      description: The exact formula (and input values, e.g. cell contents) that reproduces the issue.
      placeholder: |
        =VLOOKUP(A1, B1:C10, 2, FALSE)
        A1 = "foo", B1:C10 = ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What Google Sheets (or Excel, if that's the relevant target) actually returns for this formula. A screenshot of the formula evaluated in Google Sheets is extremely helpful here.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What truecalc returns instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package and version
      description: Which package and version you're using (e.g. `@truecalc/core@6.0.0`, `truecalc-core = "6.0.0"`).
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else relevant — runtime (Node/browser/Rust), engine flavor (`sheets`/`excel`), etc.
    validations:
      required: false
