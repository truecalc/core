[package]
name = "truecalc-wasm-value"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false  # internal-only: not published to crates.io, npm, or JSR
description = "The tagged EvalResult WASM value shape shared by @truecalc/core and @truecalc/workbook"
repository.workspace = true

[lib]
# `rlib` only: this crate is never itself compiled to a `cdylib` wasm binary —
# `crates/wasm` and `crates/wasm-workbook` each link it as an ordinary Rust
# dependency and expose their own `#[wasm_bindgen]` functions around it.
crate-type = ["rlib"]

[dependencies]
truecalc-core = { path = "../core" }
wasm-bindgen = "0.2"
tsify-next = { version = "0.5", features = ["js"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
