[package]
name = "truecalc-wasm-workbook"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false  # published to npm via wasm-pack, not crates.io
description = "Spreadsheet workbook for the browser — full Workbook API compiled to WebAssembly"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
truecalc-workbook = { path = "../workbook" }
wasm-bindgen = "0.2"
serde_json = "1"
tsify-next = { version = "0.5", features = ["js"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
