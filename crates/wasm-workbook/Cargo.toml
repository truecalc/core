[package]
name = "truecalc-wasm-workbook"
version.workspace = true
edition.workspace = true
# Not `license.workspace = true`. This crate compiles `truecalc-workbook`
# (Elastic-2.0) into the artifact published to npm and JSR as
# `@truecalc/workbook`, so the wrapper must carry the same terms as the code
# it ships. wasm-pack copies this field into the generated package.json.
# The artifact also links MIT `truecalc-core`; its notice is preserved in
# ./NOTICE, which the release workflow ships in the published tarball.
license = "Elastic-2.0"
publish = false  # published to npm via wasm-pack, not crates.io
description = "Spreadsheet workbook for the browser — full Workbook API compiled to WebAssembly"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
truecalc-workbook = { path = "../workbook" }
truecalc-core = { path = "../core" }
truecalc-wasm-value = { path = "../wasm-value" }
wasm-bindgen = "0.2"
serde_json = "1"
tsify-next = { version = "0.5", features = ["js"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
