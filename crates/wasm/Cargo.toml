[package]
name = "truecalc-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false  # published to npm via wasm-pack, not crates.io
description = "Spreadsheet formula engine for the browser — Google Sheets–compatible formula evaluator compiled to WebAssembly"
keywords = ["spreadsheet", "formula", "google-sheets", "excel", "wasm"]
categories = ["wasm", "web-programming"]
repository.workspace = true

[lib]
# `rlib` (in addition to `cdylib` for wasm-pack) lets the native test harness
# link the crate so `cargo nextest`/`cargo test` can exercise the value mapping.
crate-type = ["cdylib", "rlib"]

[dependencies]
truecalc-core = { path = "../core" }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde_json = "1"
tsify-next = { version = "0.5", features = ["js"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false  # wasm-opt segfaults on this binary; re-enable when wasm-pack ships a fix
