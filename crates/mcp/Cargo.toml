[package]
name = "truecalc-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server exposing truecalc formula evaluation as a tool for AI assistants"
repository.workspace = true
readme = "README.md"
keywords = ["mcp", "spreadsheet", "formula", "ai", "claude"]
categories = ["command-line-utilities"]

[[bin]]
name = "truecalc-mcp"
path = "src/main.rs"

# release.yml only ever dispatches off truecalc-core's tag (every crate in this
# workspace shares one version, so core always releases alongside mcp) — the
# prebuilt binaries this points at are attached to that truecalc-core release,
# not a truecalc-mcp-tagged one, so the tag prefix below is hardcoded rather
# than templated from { name }.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/truecalc-core-v{ version }/{ name }-{ target }{ binary-ext }"
pkg-fmt = "bin"

[dependencies]
truecalc-core = { path = "../core", version = "8.1" }
truecalc-workbook = { path = "../workbook", version = "8.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Validates the real `structuredContent` against the real published
# `outputSchema` (crates/mcp/tests/output_schema_conformance.rs). This server
# hand-rolls JSON-RPC, so nothing at runtime does it.
jsonschema = { version = "0.46", default-features = false }
