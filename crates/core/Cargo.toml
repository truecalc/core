[package]
name = "truecalc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Formula engine with exact Google Sheets semantics — stateless, embeddable evaluator"
repository.workspace = true
readme = "README.md"
keywords = ["spreadsheet", "formula", "google-sheets", "excel", "evaluator"]
categories = ["parser-implementations", "mathematics", "science"]

[features]
# serde off by default: keeps the default core build serde-free. Enables
# Serialize/Deserialize on EngineFlavor so downstream crates (truecalc-workbook)
# reuse the single canonical flavor enum on the JSON wire. Wire: "sheets"|"excel".
serde = ["dep:serde"]

[dependencies]
nom = "8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = { version = "0.10", default-features = false }
regex-lite = "0.1"
serde = { version = "1", features = ["derive"], optional = true }
libm = "0.2"

[dev-dependencies]
proptest = "1"
csv = "1"
serde_json = "1"
libm = "0.2"
