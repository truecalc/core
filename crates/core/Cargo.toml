[package]
name = "truecalc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Spreadsheet formula engine — parser and evaluator for Excel-compatible formulas"
repository.workspace = true
readme = "README.md"

[features]
# serde off by default: keeps the default core build serde-free. Enables
# Serialize/Deserialize on EngineFlavor so downstream crates (truecalc-workbook)
# reuse the single canonical flavor enum on the JSON wire. Wire: "sheets"|"excel".
serde = ["dep:serde"]

[dependencies]
nom = "8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
regex-lite = "0.1"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1"
calamine = "0.26"
csv = "1"
serde_json = "1"
