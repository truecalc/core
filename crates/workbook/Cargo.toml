[package]
name = "truecalc-workbook"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Workbook layer for the truecalc spreadsheet engine — engine-locked workbook, worksheet, and cell value types"
repository.workspace = true
readme = "README.md"
keywords = ["spreadsheet", "workbook", "formula", "excel", "sheets"]

[dependencies]
truecalc-core = { path = "../core", version = "3.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ryu-js = "1"
icu_casemap = "2"
chrono = { version = "0.4", default-features = false }
chrono-tz = { version = "0.10", default-features = false }

[dev-dependencies]
proptest = "1"
jsonschema = { version = "0.46", default-features = false }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "workbook_perf"
harness = false
